<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Mandarin Card Browser</title>
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: sticky search bar, progress overview, filter row, grouped list; a note opens in a side drawer (full-screen sheet on phones). */
:root {
  --bg: #f3f6f5; --surface: #ffffff; --sunk: #e9eeec; --ink: #1b2423; --muted: #5b6a67; --line: #d9e1de;
  --accent: #0e6f66; --accent-ink: #ffffff; --accent-soft: #d5ebe7;
  --s-new: #5d6fd1; --s-learn: #c98322; --s-young: #4f9f6c; --s-mature: #24614a; --s-weak: #c63d51; --s-susp: #98a3a0;
  --e-again: #c63d51; --e-hard: #c98322; --e-good: #4f9f6c; --e-easy: #3f74c4;
  --shadow: 0 10px 40px rgba(20, 40, 36, .18);
  --f-han: "LXGW WenKai TC", "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111615; --surface: #192120; --sunk: #222c2a; --ink: #e4ebe9; --muted: #92a29e; --line: #2b3735;
  --accent: #46b8a8; --accent-ink: #08201d; --accent-soft: #1d3a36;
  --s-new: #8796ec; --s-learn: #e3a54d; --s-young: #8fd6a4; --s-mature: #2a8a66; --s-weak: #ec6b7c; --s-susp: #6b7775;
  --e-again: #ec6b7c; --e-hard: #e3a54d; --e-good: #74c48f; --e-easy: #74a3ea;
  --shadow: 0 10px 40px rgba(0, 0, 0, .5); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111615; --surface: #192120; --sunk: #222c2a; --ink: #e4ebe9; --muted: #92a29e; --line: #2b3735;
  --accent: #46b8a8; --accent-ink: #08201d; --accent-soft: #1d3a36;
  --s-new: #8796ec; --s-learn: #e3a54d; --s-young: #8fd6a4; --s-mature: #2a8a66; --s-weak: #ec6b7c; --s-susp: #6b7775;
  --e-again: #ec6b7c; --e-hard: #e3a54d; --e-good: #74c48f; --e-easy: #74a3ea;
  --shadow: 0 10px 40px rgba(0, 0, 0, .5); color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.han { font-family: var(--f-han) }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums }

/* header */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line) }
header .wrap { display: flex; gap: 16px; align-items: center; padding-block: 12px; flex-wrap: wrap }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0 }
.brand h1 { margin: 0; font: 700 24px/1 var(--f-han); letter-spacing: .02em }
.brand small { color: var(--muted); font-size: 12px; white-space: nowrap }
.search { flex: 1 1 180px; position: relative; min-width: 0 }
.search input { width: 100%; padding: 10px 36px 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 16px }
.search input::placeholder { color: var(--muted) }
.search button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 18px; padding: 4px 8px }

/* overview */
.overview { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; padding-block: 18px 6px }
@media (max-width: 760px) { .overview { grid-template-columns: minmax(0, 1fr) } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0 }
.panel h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.dots { width: 100%; min-height: 20px; overflow: hidden }
.dots svg { display: block }
.dotg { cursor: pointer }
.dotg:hover circle, .dotg:focus-visible circle { filter: brightness(1.15) }
.dotg:focus-visible { outline: none }
.ringkey { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 8px }
.ringkey svg { flex: none }
.dots-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; white-space: nowrap }
.chip .cdot { width: 9px; height: 9px; border-radius: 50% }
.chip b { font-weight: 600; font-family: var(--f-mono); font-size: 12px }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.forecast { display: flex; align-items: flex-end; gap: 3px; height: 70px }
.forecast div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 3px; min-width: 0 }
.forecast i { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .85 }
.forecast div:first-child i { opacity: 1; background: var(--s-learn) }
.forecast em { font: normal 10px var(--f-mono); color: var(--muted) }
.forecast-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px }
.fc-sum { font-size: 13px; color: var(--muted); margin: -4px 0 10px }
.fc-sum b { color: var(--ink); font-family: var(--f-mono) }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding-block: 14px }
.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; font-size: 13px; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12) }
label.sel { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted) }
label.sel select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; max-width: 46vw }
.count { margin-left: auto; font-size: 13px; color: var(--muted) }

/* list */
.group { margin-bottom: 22px }
.group h3 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .03em }
.group h3 .han { font-size: 15px; color: var(--ink) }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; padding: 11px 16px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left }
.row:first-child { border-top: 0 }
.row:hover { background: var(--sunk) }
.row .main { min-width: 0; display: flex; flex-direction: column; gap: 1px }
.row .line1 { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0 }
.row .hz { font: 400 24px/1.25 var(--f-han) }
.row.sentence .hz, .row.grammar .hz { font-size: 19px }
.row .zy { font: 14px var(--f-han); color: var(--muted) }
.row .py { font-size: 14px; color: var(--accent) }
.row .en { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row .kind { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 0 5px; border-radius: 4px }
.weakflag { color: var(--s-weak); font-size: 11px; font-weight: 600; letter-spacing: .04em }
.pips { display: flex; gap: 6px }
.pip { display: flex; flex-direction: column; align-items: center; width: 44px; padding: 3px 0 2px; border-radius: 7px; background: var(--sunk); font-size: 10px; line-height: 1.25 }
.pip .t { font-weight: 600; letter-spacing: .05em; color: var(--muted) }
.pip .v { font-family: var(--f-mono); font-size: 11px }
.pip::before { content: ""; width: 26px; height: 4px; border-radius: 2px; background: var(--c, var(--s-susp)); margin-bottom: 2px }
@media (max-width: 560px) {
  .row { grid-template-columns: minmax(0, 1fr); gap: 8px }
  .pip { width: auto; flex-direction: row; gap: 5px; padding: 2px 8px }
  .pip::before { width: 8px; height: 8px; margin: 0 }
}
.empty { padding: 40px 16px; text-align: center; color: var(--muted) }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 20, 18, .35); z-index: 20 }
aside.drawer { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); box-shadow: var(--shadow); overflow-y: auto; overscroll-behavior: contain;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 40px) 20px }
@media (max-width: 560px) { aside.drawer { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) } }
@media (prefers-reduced-motion: no-preference) { aside.drawer { animation: slide .18s ease-out } @keyframes slide { from { transform: translateX(24px); opacity: .4 } } }
.dtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px }
.dtop .kind { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px }
.big { font: 400 46px/1.15 var(--f-han); margin: 4px 0 2px; overflow-wrap: anywhere }
.big.long { font-size: 30px }
.simp { font: 15px var(--f-han); color: var(--muted) }
.read-zy { font: 20px var(--f-han); margin-top: 6px }
.read-py { font-size: 17px; color: var(--accent) }
.meaning { font-size: 18px; margin: 10px 0 4px }
.cloze { color: var(--accent); font-weight: 700; border-bottom: 2px solid var(--accent) }
.cloze small { font: 12px var(--f-body); color: var(--muted); font-weight: 400 }
.sect { margin-top: 20px }
.sect h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.example { background: var(--sunk); border-radius: 10px; padding: 10px 14px }
.example .hz2 { font: 20px var(--f-han) }
.example .hz2 b { color: var(--accent) }
.example .p2 { color: var(--accent); font-size: 14px }
.example .t2 { color: var(--muted); font-size: 14px }
.notes { font-size: 14px; line-height: 1.6 }
.bd { overflow-x: auto }
.bd table { border-collapse: collapse; width: 100%; font-size: 14px }
.bd td { padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: top }
.bd td.w { font: 19px var(--f-han); white-space: nowrap }
.bd td.p { color: var(--accent); white-space: nowrap }
.tags { display: flex; flex-wrap: wrap; gap: 6px }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--sunk); border: 0; color: var(--muted) }
.cardstat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px }
.cardstat .hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.cardstat .nm { font-weight: 600 }
.pill { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; color: #fff; background: var(--c) }
.cardstat .due { margin-left: auto; font-size: 13px; color: var(--muted) }
.kv { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 8px 0 6px; font-size: 12px; color: var(--muted) }
.kv b { display: block; color: var(--ink); font: 500 15px var(--f-mono) }
.hist { display: flex; flex-wrap: wrap; gap: 3px }
.hist span { width: 12px; height: 12px; border-radius: 3px; background: var(--c) }
.hist span.lrn { opacity: .55 }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 6px }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: var(--c) }
svg.ivl { width: 100%; height: auto; display: block }
.footer-id { margin-top: 24px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 30 }
.lock { min-height: 70vh; display: grid; place-items: center; padding-block: 40px }
.lock form { width: min(360px, 100%); display: flex; flex-direction: column; gap: 12px }
.lock h2 { margin: 0; font: 700 32px/1.2 var(--f-han) }
.lock p { margin: 0; color: var(--muted); font-size: 14px }
.lock input[type=password] { padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 16px }
.lock label.rem { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted) }
.lock button.go { padding: 11px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600 }
.lock .err { color: var(--s-weak); font-size: 14px; min-height: 1.4em }
.trbtn { padding: 9px 14px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; white-space: nowrap }
.tr h2 { margin: 0 0 4px; font: 700 24px var(--f-han) }
.tr p.lead { margin: 0 0 12px; color: var(--muted); font-size: 14px }
.tr textarea { width: 100%; min-height: 76px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font: 17px/1.4 var(--f-body); resize: vertical }
.tr .acts { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap }
.btn { padding: 9px 16px; border: 0; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-weight: 600 }
.btn.ghost { background: var(--sunk); color: var(--ink) }
.btn:disabled { opacity: .5; cursor: default }
.tr .status { font-size: 14px; color: var(--muted) }
.tr .status.bad { color: var(--s-weak) }
.answer { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--sunk) }
.answer .a-hz { font: 36px/1.2 var(--f-han) }
.answer .a-zy { font: 18px var(--f-han); color: var(--muted) }
.answer .a-py { color: var(--accent); font-size: 16px }
.answer .a-en { font-size: 17px; margin-top: 6px }
.answer .a-note { font-size: 14px; color: var(--muted); margin-top: 6px }
.have { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px; padding: 3px 10px }
.prop { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line) }
.prop input { width: 18px; height: 18px; margin-top: 4px; accent-color: var(--accent) }
.prop .p-hz { font: 20px var(--f-han) }
.prop .p-sub { font-size: 13px; color: var(--muted) }
.prop .p-warn { font-size: 13px; color: var(--s-weak) }
.prop .badge { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); padding: 0 5px; border-radius: 4px; margin-right: 6px }
.queue { font-size: 14px }
.qrow { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line) }
.qrow .qs { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; color: #fff; background: var(--c); white-space: nowrap }
.qrow .qt { min-width: 0; overflow-wrap: anywhere }
</style>

<section class="lock wrap" id="lock" hidden>
  <form id="lockform">
    <h2>我的卡片</h2>
    <p>Enter your passphrase to open your cards. It's checked in this browser only.</p>
    <input id="pass" type="password" autocomplete="current-password" aria-label="Passphrase" placeholder="Passphrase">
    <label class="rem"><input id="remember" type="checkbox" checked> Stay unlocked on this device</label>
    <button class="go" id="unlock" type="submit">Unlock</button>
    <div class="err" id="lockerr" role="alert"></div>
  </form>
</section>
<div id="app">
<header>
  <div class="wrap">
    <div class="brand"><h1>我的卡片</h1><small id="updated"></small><button class="iconbtn" type="button" id="lockbtn" hidden>Lock</button></div>
    <div class="search">
      <input id="q" type="search" placeholder="Search 漢字, ㄓㄨˋ ㄧㄣ, pinyin (tones optional), English…" autocomplete="off" spellcheck="false" aria-label="Search cards">
      <button id="qclear" type="button" aria-label="Clear search" hidden>×</button>
    </div>
    <button class="trbtn" id="trbtn" type="button">譯 Translate</button>
  </div>
</header>

<main class="wrap">
  <section class="overview">
    <div class="panel">
      <h2>Your notes, by day first studied</h2>
      <div class="dots" id="dots" aria-label="Each dot is a note, ordered by the day it was first studied"></div>
      <div class="dots-axis" id="dotsaxis"></div>
      <div class="ringkey"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="10" fill="var(--sunk)" stroke="var(--muted)"/><circle cx="11" cy="11" r="6.7" fill="var(--sunk)" stroke="var(--muted)"/><circle cx="11" cy="11" r="3.3" fill="var(--sunk)" stroke="var(--muted)"/></svg>Rings, outside in: Say · Listen · Read. Red ring: weak. Columns: the day you first studied each note.</div>
      <div class="chips" id="statusChips"></div>
    </div>
    <div class="panel">
      <h2>Reviews coming up</h2>
      <p class="fc-sum" id="fcsum"></p>
      <div class="forecast" id="forecast"></div>
      <div class="forecast-axis"><span>today</span><span>+7</span><span>+13 days</span></div>
    </div>
  </section>

  <section class="controls">
    <div class="seg" id="kindSeg" role="group" aria-label="Note type"></div>
    <label class="sel">Tag <select id="tag"></select></label>
    <label class="sel">Sort <select id="sort">
      <option value="added">Newest first</option>
      <option value="due">Due soonest</option>
      <option value="weak">Weakest first</option>
      <option value="strong">Best known first</option>
      <option value="alpha">Pinyin A–Z</option>
    </select></label>
    <label class="sel">Group <select id="group">
      <option value="none">None</option>
      <option value="status">Status</option>
      <option value="kind">Type</option>
      <option value="tag">Tag</option>
      <option value="week">Week added</option>
    </select></label>
    <span class="count" id="count"></span>
  </section>

  <section id="list"></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog"></aside>
</div>

/* ---------- model (pure functions; reusable by a future study app) ---------- */
const DAY = 86400;
const STATUS = {
  new:    { label: "New",       c: "--s-new",    rank: 0 },
  learn:  { label: "Learning",  c: "--s-learn",  rank: 1 },
  young:  { label: "Young",     c: "--s-young",  rank: 2 },
  mature: { label: "Mature",    c: "--s-mature", rank: 3 },
  susp:   { label: "Suspended", c: "--s-susp",   rank: 4 },
};
const STATUS_HELP = { new: "not studied yet", learn: "in learning steps or relearning", young: "interval under 3 weeks", mature: "interval 3 weeks or more" };
const KINDS = { vocab: "Words", sentence: "Sentences", grammar: "Grammar", other: "Other" };
const EASE = { 1: ["Again", "--e-again"], 2: ["Hard", "--e-hard"], 3: ["Good", "--e-good"], 4: ["Easy", "--e-easy"] };

const stripTags = s => { const d = document.createElement("div"); d.innerHTML = (s || "").replace(/<br\s*\/?>/gi, " "); return (d.textContent || "").trim(); };
const unCloze = s => (s || "").replace(/\{\{c\d+::(.*?)(?:::(.*?))?\}\}/gs, "$1");
const fold = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[ˊˇˋ˙]/g, "").toLowerCase().replace(/ü/g, "v").replace(/[\s'’\-.,!?;:，。？！、]/g, "");

function cardStatus(c) {
  if (c.queue === -1) return "susp";
  if (c.type === 0) return "new";
  if (c.type === 1 || c.type === 3) return "learn";
  return c.ivl >= 21 ? "mature" : "young";
}

function enrich(n, now) {
  const f = n.f;
  const head = n.kind === "grammar" ? unCloze(f.Text) : (f.Traditional || Object.values(f)[0] || "");
  const english = f.Meaning || f.Translation || f.Context || "";
  const cards = n.cards.map(c => {
    const st = cardStatus(c);
    const again30 = c.rev.filter(r => r[1] === 1 && now - r[0] < 30 * DAY).length;
    return { ...c, st, again30 };
  });
  const active = cards.filter(c => c.st !== "susp");
  let st;
  if (!active.length) st = "susp";
  else if (active.every(c => c.st === "new")) st = "new";
  else if (active.some(c => c.st === "new" || c.st === "learn")) st = "learn";
  else st = active.some(c => c.st === "young") ? "young" : "mature";
  const lapses = cards.reduce((a, c) => a + c.lapses, 0);
  const again30 = cards.reduce((a, c) => a + c.again30, 0);
  const minEase = Math.min(...cards.map(c => c.ease || 250));
  const weakScore = again30 * 2 + lapses * 1.5 + Math.max(0, (250 - minEase) / 15);
  const dues = active.filter(c => c.due !== null).map(c => c.due);
  const reviewed = cards.flatMap(c => c.rev);
  return {
    ...n, cards, st, head, english, lapses, again30, minEase, weakScore,
    weak: again30 >= 3 || lapses >= 2 || minEase <= 170,
    nextDue: dues.length ? Math.min(...dues) : null,
    maxIvl: Math.max(0, ...cards.map(c => c.ivl)),
    added: Math.floor(n.id / 1000),
    reviews: reviewed.length,
    intro: reviewed.length ? Math.min(...reviewed.map(r => r[0])) : null,
    pos: Math.min(...cards.map(c => c.pos ?? 1e9)),
    hay: fold([head, f.Simplified, f.Zhuyin, f.Pinyin, english, f.Example, f.ExamplePinyin, f.ExampleTranslation, f.Notes, f.Pattern, f.Breakdown, n.tags.join(" ")].map(x => stripTags(unCloze(x))).join("|")),
    pyKey: fold(stripTags(f.Pinyin || head)),
  };
}

function matches(n, q) {
  if (!q.trim()) return true;
  const joined = fold(q);
  if (n.hay.includes(joined)) return true;
  const toks = q.split(/\s+/).map(fold).filter(Boolean);
  return toks.length > 1 && toks.every(t => n.hay.includes(t));
}

/* ---------- state ---------- */
let now = Math.floor(Date.now() / 1000);
let NOTES = [];
const prefs = (() => { try { return JSON.parse(localStorage.getItem("mcb-prefs") || "{}"); } catch { return {}; } })();
const state = { q: "", kind: "all", status: null, weak: false, tag: "", sort: prefs.sort || "added", group: prefs.group || "none" };
const savePrefs = () => { try { localStorage.setItem("mcb-prefs", JSON.stringify({ sort: state.sort, group: state.group })); } catch {} };

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clean = s => (s || "").replace(/\[sound:[^\]]*\]/g, "").replace(/<script[\s\S]*?<\/script>/gi, "").replace(/\son\w+="[^"]*"/gi, "");
const fmtDate = t => new Date(t * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric", year: new Date(t * 1000).getFullYear() === new Date(now * 1000).getFullYear() ? undefined : "numeric" });
const dueText = d => d === null ? "not started" : d < 0 ? `overdue ${-d}d` : d === 0 ? "due today" : d === 1 ? "due tomorrow" : `due in ${d}d`;
const ivlText = i => i <= 0 ? "—" : i < 30 ? `${i}d` : i < 365 ? `${(i / 30).toFixed(i < 60 ? 1 : 0)}mo` : `${(i / 365).toFixed(1)}y`;
const shortT = t => ({ Read: "Read", Say: "Say", Listen: "Lstn", "Fill in": "Fill" }[t] || t.slice(0, 4));
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1800); }
function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text); u.lang = "zh-TW"; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^zh/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch { toast("This browser can't play speech here"); }
}

/* ---------- overview ---------- */
function renderOverview() {
  if (DATA) $("updated").textContent = `${DATA.deck} · synced ${new Date(DATA.generated * 1000).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}`;
  const counts = {}; Object.keys(STATUS).forEach(k => counts[k] = 0);
  NOTES.forEach(n => counts[n.st]++);
  const total = NOTES.length || 1;
  drawDots();
  const weakN = NOTES.filter(n => n.weak).length;
  $("statusChips").innerHTML = ["mature", "young", "learn", "new", "susp"].filter(k => counts[k] || k !== "susp").map(k =>
    `<button class="chip" type="button" data-status="${k}" aria-pressed="${state.status === k}" title="${STATUS_HELP[k] || ""}"><span class="cdot" style="background:var(${STATUS[k].c})"></span>${STATUS[k].label} <b>${counts[k]}</b></button>`).join("")
    + `<button class="chip" type="button" data-weak aria-pressed="${state.weak}" title="3+ Agains in 30 days, 2+ lapses, or ease 170% or lower"><span class="cdot" style="background:var(--s-weak)"></span>Weak spots <b>${weakN}</b></button>`;

  const fc = Array(14).fill(0);
  let learnNow = 0;
  NOTES.forEach(n => n.cards.forEach(c => {
    if (c.st === "susp" || c.due === null) return;
    const d = Math.max(0, c.due);
    if (d < 14) fc[d]++;
  }));
  const max = Math.max(1, ...fc);
  $("forecast").innerHTML = fc.map((v, i) => `<div title="${i === 0 ? "today (incl. overdue)" : "+" + i + " days"}: ${v} cards"><em>${v || ""}</em><i style="height:${v / max * 52}px"></i></div>`).join("");
  const week = fc.slice(0, 7).reduce((a, b) => a + b, 0);
  const newQueued = NOTES.filter(n => n.st === "new").length;
  $("fcsum").innerHTML = `<b>${fc[0]}</b> cards due today · <b>${week}</b> this week · <b>${newQueued}</b> new notes waiting`;
}

/* Dots: one column per day a note was first studied (piled bottom-up), new notes last.
   Each dot is concentric rings, one per card: outer Say, middle Listen, inner Read. */
const RING_ORDER = ["Say", "Listen", "Read"];
function dotColumns() {
  const cols = new Map();
  [...NOTES].sort((a, b) => (a.intro ?? 1e12) - (b.intro ?? 1e12) || (a.pos ?? 0) - (b.pos ?? 0) || a.id - b.id).forEach(n => {
    const k = n.intro ? new Date(n.intro * 1000).toDateString() : "new";
    if (!cols.has(k)) cols.set(k, { label: n.intro ? fmtDate(n.intro) : "not started", notes: [] });
    cols.get(k).notes.push(n);
  });
  return [...cols.values()];
}
function drawDots() {
  const box = $("dots"); if (!box) return;
  const cols = dotColumns(), W = box.clientWidth;
  if (!W || !cols.length) { box.innerHTML = ""; return; }
  const maxStack = Math.max(...cols.map(c => c.notes.length));
  const cell = Math.min(W / cols.length, 150 / maxStack), r = cell / 2 * 0.86, H = Math.ceil(cell * maxStack);
  const x0 = (W - cell * cols.length) / 2;
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Notes by day first studied">`;
  cols.forEach((col, ci) => col.notes.forEach((n, si) => {
    const cx = x0 + cell * (ci + .5), cy = H - cell * (si + .5);
    const cards = [...n.cards].filter(c => c.st !== "susp").sort((a, b) => (RING_ORDER.indexOf(a.t) + 9) % 9 - (RING_ORDER.indexOf(b.t) + 9) % 9);
    const rings = cards.length ? cards : n.cards;

function ivlChart(cards) {

  const y = v => T + (1 - Math.sqrt(v) / Math.sqrt(vmax)) * (H - T - B);
  const ticks = [0, 1, 7, 30, 90, 180, 365].filter(v => v <= vmax);

  ticks.forEach(v => svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${v ? ivlText(v) : "0"}</text>`);

    <div class="tr"><h2>翻譯</h2><p class="lead">Type English, 中文 or pinyin. Claude answers with Taiwan readings and proposes cards.</p>

function propHTML(c, i) {

    <span><span class="badge">${esc(c.type)}</span><span class="p-hz">${c.type === "grammar" ? esc(hz).replace(/\{\{c\d+::(.*?)(?:::(.*?))?\}\}/g, '<span class="cloze">$1</span>') : esc(hz)}</span>
    <div class="p-sub">${esc(c.zhuyin)} · ${esc(c.pinyin)}</div><div class="p-sub">${esc(sub)}</div>

function renderTrResult() {

  $("trout").innerHTML = `<div class="answer"><div class="a-hz">${esc(a.traditional)}</div><div class="a-zy">${esc(a.zhuyin)}</div><div class="a-py">${esc(a.pinyin)}</div>
      <div class="a-en">${esc(a.meaning)}</div>${a.note ? `<div class="a-note">${esc(a.note)}</div>` : ""}

    ${(r.cards || []).length ? `<div class="sect"><h4>Proposed cards</h4>${r.cards.map(propHTML).join("")}

  $("trsay").onclick = () => speak(stripTags(a.traditional));

async function runTranslate() {

  try {

    trResult = { ...r, query: q }; $("trstatus").textContent = ""; renderTrResult();
  } catch (e) {

async function queueSelected() {

  if (!picked.length) { toast("Tick at least one card"); return; }

}
function renderQueue() {

  const QS = { pending: ["Waiting", "--s-learn"], added: ["Added", "--s-mature"], error: ["Needs a fix", "--s-weak"] };
  const rows = queueRows.filter(r => r.status !== "added" || Date.now() - (r.doneAt || r.createdAt) < 7 * DAY * 1000);
  el.innerHTML = rows.length ? rows.map(r => { const [l, c] = QS[r.status] || [r.status, "--s-susp"]; const what = (r.cards || []).map(c => stripTags(c.traditional || unCloze(c.text || ""))).join("、");
    return `<div class="qrow"><span class="qs" style="--c:var(${c})">${esc(l)}</span><span class="qt">${esc(what)}${r.message ? ` <span class="status">· ${esc(r.message)}</span>` : ""}</span></div>`; }).join("")
    : `<span class="status">Nothing queued. Cards you add appear here until Claude puts them in your deck.</span>`;

async function openTranslator() {
  lastFocus = document.activeElement;
  const d = $("drawer"); delete d.dataset.nid;
  const sample = await samplePromise;
  d.innerHTML = trHTML(!!sample); d.hidden = false; $("scrim").hidden = false; d.scrollTop = 0; document.body.style.overflow = "hidden";
  $("close").onclick = closeNote;
  setHash("#translate");
  if (!sample) return;
  $("trq").focus();
  $("trgo").onclick = runTranslate; $("trstop").onclick = () => trCtl?.abort();
  $("trq").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) runTranslate(); });
  renderTrResult();
  const db = await dbPromise;
  if (!db) { $("trqueue").innerHTML = `<span class="status">The card queue isn't available in this view.</span>`; return; }
  if (!queueUnsub) {
    const timer = setTimeout(() => { if (!queueRows.length) $("trqueue") && ($("trqueue").innerHTML = `<span class="status">The queue is taking a while to load.</span>`); }, 10000);
    queueUnsub = db.collection("requests").orderBy("createdAt", "desc").limit(30).onSnapshot(snap => { clearTimeout(timer); queueRows = snap.docs.map(x => ({ id: x.id, ...x.data() })); renderQueue(); },
      () => { clearTimeout(timer); $("trqueue") && ($("trqueue").innerHTML = `<span class="status">Couldn't load the queue.</span>`); });

$("trbtn").onclick = openTranslator;

/* ---------- boot: plain data, or encrypted data unlocked with the passphrase ---------- */
function start(data) {
  DATA = data; now = data ? data.generated : now;
  NOTES = data ? data.notes.map(n => enrich(n, now)) : [];
  $("lock").hidden = true; $("app").hidden = false;
  if (RAW && RAW.ct) { $("lockbtn").hidden = false; $("lockbtn").onclick = lockNow; }
  renderOverview(); renderControls(); renderList(); fromHash();
}
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const IDB = { name: "mcb", store: "keys" };
function idb(mode, fn) {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB.name, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB.store);
    r.onerror = () => rej(r.error);
    r.onsuccess = () => { const tx = r.result.transaction(IDB.store, mode); const q = fn(tx.objectStore(IDB.store)); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); };

}
async function unwrapKey(pass, w) {

}
async function decryptData(priv, raw) {

  const bits = await crypto.subtle.deriveBits({ name: "ECDH", public: epk }, priv, 256);
  const hk = await crypto.subtle.importKey("raw", bits, "HKDF", false, ["deriveKey"]);
  const aes = await crypto.subtle.deriveKey({ name: "HKDF", hash: "SHA-256", salt: ub64(raw.salt), info: new TextEncoder().encode("mandarin-browser v1") }, hk, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

async function boot() {
